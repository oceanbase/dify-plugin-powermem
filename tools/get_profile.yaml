identity:
  name: get_profile
  author: PowerMem Team
  label:
    en_US: Get User Profile
    zh_Hans: 获取用户画像
description:
  human:
    en_US: Get user profile information (sync). Only available when User Profile feature is enabled (UserMemory + OceanBase).
    zh_Hans: 同步获取用户画像信息。仅在启用用户画像功能（UserMemory + OceanBase）时可用。
  llm: Get user profile by user_id. Only works when user_profile_enabled=true and db_provider=oceanbase.
parameters:
  - name: user_id
    type: string
    required: true
    label:
      en_US: User ID
      zh_Hans: 用户ID
    human_description:
      en_US: User identifier (required).
      zh_Hans: 用户标识（必填）。
    llm_description: "Required. User identifier string. SDK: UserMemory.profile(user_id) returns a dict (or {} if not found) containing keys like id, user_id, profile_content, topics, created_at, updated_at."
    form: llm
extra:
  python:
    source: tools/get_profile.py

